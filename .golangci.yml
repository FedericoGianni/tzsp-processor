version: "2"
run:
  modules-download-mode: mod
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - gitlab.com/forbay/tzsp-processor
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
